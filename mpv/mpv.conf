# ---- Video quality tuning ----
# State the renderer explicitly (libplacebo based; the shader chain rides on it)
vo=gpu-next
profile=high-quality
deband=yes
dither-depth=auto
# Smooth 24fps playback on a high refresh display (judder removal)
video-sync=display-resample
interpolation=yes
tscale=oversample
# Correct transfer hint when an HDR display is present (no effect on SDR)
target-colorspace-hint=yes

# ---- yt-dlp: best quality up to 1440p ----
ytdl-format=bestvideo[height<=?1440]+bestaudio/best

# ---- Playback comfort ----
# Save position on quit and resume from there next time
save-position-on-quit=yes
# Do NOT write transient settings into the resume file, otherwise a video can
# come back muted (aid/mute), filtered (af) or with RIFE still on (vf)
watch-later-options-remove=vf
watch-later-options-remove=af
watch-later-options-remove=aid
watch-later-options-remove=mute
watch-later-options-remove=volume
# Do not close at end of file; hold on the last frame
keep-open=yes
# Raise the volume ceiling to 200% (for quiet sources; above 100 is software gain)
volume-max=200

# ---- Screenshots ----
screenshot-format=png
screenshot-png-compression=7
screenshot-directory=~~desktop/mpv-screenshots
# filename-timestamp-index.png
# QUOTES REQUIRED: the value starts with %, so unquoted mpv reads it as
# "fixed-length quoting" and rejects the whole line (measured).
screenshot-template="%F-%P-%02n"

# ---- Automatic track language selection ----
# Subtitles: Turkish first, English as fallback
slang=tr,tur,en,eng
# Audio: Japanese first (original anime audio), then Turkish/English
alang=ja,jpn,tr,tur,en,eng

# ---- Moved here from the global config in the install folder ----
# Hardware decoding (the copy mode is what RIFE/VapourSynth requires)
hwdec=auto-copy
gpu-api=vulkan

# ---- Color modes (menu > Colors) ----
# The .cube files in luts\ are built for gamma-encoded values
lut-type=native

# ---- Automatic deinterlacing ----
# Applied only to frames flagged interlaced; progressive content is untouched.
# Manual control: the d key
deinterlace=auto
# Optimized shaders for higher-end GPU: Mode A (HQ)
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"

# ============================================================
#  PROFILE SYMMETRY RULE
#  mpv profiles cannot be undone: a profile only changes the properties it
#  writes itself. So EVERY profile that touches the scaler must write the same
#  three properties explicitly. Otherwise, once you switched to FSRCNNX,
#  scale/dscale/linear-downscaling stayed at FSRCNNX values for good (measured).
#  Anime4K and CAS profiles apply the [scaler-defaults] profile below.
# ============================================================
[scaler-defaults]
profile-desc=Scaler defaults (Anime4K / CAS / no shaders)
scale=ewa_lanczossharp
dscale=hermite
linear-downscaling=yes

# ---- FSRCNNX (heavy) - live action / general content ----
# FSRCNNX upscales luma, KrigBilateral aligns chroma, and SSimDownscaler
# downscales cleanly when the image stays larger than the screen.
# scale is lowered, otherwise a second scaling pass rides on top of FSRCNNX.
[fsrcnnx]
profile-desc=FSRCNNX x2 16 (HQ) + Krig + SSimDownscaler
glsl-shaders="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl;~~/shaders/KrigBilateral.glsl;~~/shaders/SSimDownscaler.glsl"
scale=ewa_lanczos
dscale=mitchell
linear-downscaling=no

# ---- FSRCNNX (light) - same chain, lower GPU cost ----
[fsrcnnx-light]
profile-desc=FSRCNNX x2 8 (fast) + Krig
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl;~~/shaders/KrigBilateral.glsl"
scale=ewa_lanczos
dscale=mitchell
linear-downscaling=no

# ---- ArtCNN - newer CNN luma upscaler (experimental) ----
# ArtCNN doubles luma, CfL_Prediction reconstructs chroma by predicting it
# from luma (a modern alternative to KrigBilateral), and SSimDownscaler
# downscales cleanly when the image stays larger than the screen.
[artcnn]
profile-desc=ArtCNN C4F16 + CfL Prediction + SSimDownscaler
glsl-shaders="~~/shaders/ArtCNN_C4F16.glsl;~~/shaders/CfL_Prediction.glsl;~~/shaders/SSimDownscaler.glsl"
scale=ewa_lanczos
dscale=mitchell
linear-downscaling=no



