# ============================================================
#  RIFE frame interpolation policy
#  Read by BOTH rife.vpy and paneller.lua (single source of truth).
#  Changing it from the menu writes here. Safe to edit by hand.
# ============================================================

# --- Resolution policy -----------------------------------------------------
# mode = performance | balanced | quality
#
#   performance : anything above work_height is downscaled before RIFE.
#                 Fastest. 1080p is processed at work_height and the
#                 shaders upscale it back. (Measured real-time on Arc B580.)
#   balanced    : full resolution up to 1080p (optical flow at half res).
#                 Only sources above 1080p are downscaled.
#                 No detail loss at 1080p, roughly 2x the GPU cost.
#   quality     : never downscale. Needs a strong GPU.
#
# What downscaling costs: 1080p -> 720p throws away a third of the linear
# detail. Anime4K/FSRCNNX upscale it back but cannot fully recover it.
mode=performance

# Target height when downscaling (used only by modes that downscale).
work_height=480

# --- 4K and above ----------------------------------------------------------
# RIFE never runs on sources TALLER than this (0 = disabled).
# Why: downscaling 4K to 720p and interpolating destroys the very detail
# that makes 4K worth having - you trade detail for smoothness.
# 1440 = RIFE off for 4K, on up to 1440p.
skip_above_height=0

# --- Frame rate threshold --------------------------------------------------
# RIFE never runs on sources ABOVE this frame rate.
# 60fps content is already smooth; pushing it to 120fps creates a load no
# GPU keeps up with, which shows up as slow motion.
# 0 = no threshold (RIFE runs at any frame rate).
fps_threshold=0

# --- Interpolation ---------------------------------------------------------
# multiplier = 2 | 3 | 4   (24fps -> 48 / 72 / 96)
# 4x costs roughly twice the GPU time of 2x.
multiplier=2

# Skip interpolation across scene cuts (prevents ghosting).
# NOTE: measured - this protection does NOT trigger on full-frame
# flash/strobe content, where RIFE can produce broken intermediate frames.
scene_detect=1

# --- Model / hardware ------------------------------------------------------
# model=23 -> rife-v4.6 (ensemble off). Other models live under
# vapoursynth\models\.
model=23

# gpu = which GPU to use. On dual-GPU machines device 0 may be the
# integrated one; if it is wrong, RIFE will be slow.
gpu=0
gpu_thread=2
