# ============================================================
#  mpv input.conf - uosc right-click menu + keybindings
#  Menu items open inside uosc's own menu (theme comes from uosc.conf).
#  Lines starting with "#" are keyless menu entries:
#  uosc reads them, mpv ignores them.
# ============================================================

# Right click = menu (replaces the default "right click pauses" behaviour)
MBTN_RIGHT script-binding uosc/menu

# ------------------------------------------------------------
#  FILE
# ------------------------------------------------------------
#           script-binding uosc/open-file                     #! File > Open File...
#           script-binding uosc/load-video                    #! File > Load External Video...
#           script-binding uosc/paste-to-open                 #! File > Open from Clipboard (URL / file)
#           script-binding memo-history                       #! File > Recently Played
#           script-binding uosc/playlist                      #! File > Playlist
#           script-binding uosc/chapters                      #! File > Chapters
#           script-binding uosc/editions                      #! File > Editions
#           script-binding uosc/show-in-directory             #! File > Show in Explorer
#           script-binding uosc/open-config-directory         #! File > Open mpv Config Folder

# ------------------------------------------------------------
#  PLAYBACK
# ------------------------------------------------------------
#           cycle pause                                       #! Playback > Play / Pause
#           playlist-prev                                     #! Playback > Previous File
#           playlist-next                                     #! Playback > Next File
#           set speed 0.5                                     #! Playback > Speed > 0.50x
#           set speed 0.75                                    #! Playback > Speed > 0.75x
#           set speed 1.0                                     #! Playback > Speed > 1.00x (normal)
#           set speed 1.25                                    #! Playback > Speed > 1.25x
#           set speed 1.5                                     #! Playback > Speed > 1.50x
#           set speed 2.0                                     #! Playback > Speed > 2.00x
#           ab-loop                                           #! Playback > A-B Loop Point (set A / set B / clear)
#           cycle-values loop-file inf no                     #! Playback > Loop File (toggle)
#           cycle-values loop-playlist inf no                 #! Playback > Loop Playlist (toggle)
#           frame-step                                        #! Playback > Frame Step > Forward
#           frame-back-step                                   #! Playback > Frame Step > Backward
#           seek 85 ; show-text "Opening skipped (+85 s)"     #! Playback > Skip Opening (+85 s)

# ------------------------------------------------------------
#  VIDEO - panel (menu stays open on selection); d/K/L/M keys still work
# ------------------------------------------------------------
#           script-message panel-video                        #! Video
d           cycle deinterlace
K           script-message panel-video-matris bt709
L           script-message panel-video-matris bt601
M           vf toggle @film:fps=23.976:round=near

# ------------------------------------------------------------
#  VIDEO QUALITY - every decision lives in panels.lua (single source of truth)
#  CTRL keys go through the same policy layer: if a RIFE profile hits the
#  source fps/resolution thresholds, no filter is added and the reason is shown.
# ------------------------------------------------------------
#           script-message panel-goruntu                      #! Video Quality
CTRL+1 script-message panel-goruntu-sec 1
CTRL+2 script-message panel-goruntu-sec 2
CTRL+3 script-message panel-goruntu-sec 3
CTRL+4 script-message panel-goruntu-sec 4
CTRL+5 script-message panel-goruntu-sec 5
CTRL+6 script-message panel-goruntu-sec 6
CTRL+9 script-message panel-goruntu-rife
CTRL+0 script-message panel-goruntu-kapat
h           cycle deband
k set deband "yes" ; cycle-values deband-iterations "2" "4" "6" ; cycle-values deband-threshold "32" "48" "64" ; cycle-values deband-range "16" "24" "32" ; show-text ${?deband-iterations==2:DebandModeLight}${?deband-iterations==4:DebandModeMedium}${?deband-iterations==6:DebandModeStrong}

# ------------------------------------------------------------
#  COLORS - LUT panel (menu stays OPEN after a pick = live comparison)
# ------------------------------------------------------------
#           script-message panel-renkler                      #! Colors

# ------------------------------------------------------------
#  AUDIO
# ------------------------------------------------------------
#           script-binding uosc/audio                         #! Audio > Audio Track...
#           script-binding uosc/audio-device                  #! Audio > Audio Device...
#           script-binding uosc/load-audio                    #! Audio > Load External Audio...
#           script-message panel-eq                           #! Audio > Equalizer
#           script-message panel-kanal                        #! Audio > Channels / Headphones...
a           cycle audio                                       #! Audio > Next Audio Track
D           af toggle "acompressor=ratio=4,loudnorm"          #! Audio > Normalize + Compressor (toggle)
b           add audio-delay +0.042                            #! Audio > Delay > +42 ms
n           add audio-delay -0.042                            #! Audio > Delay > -42 ms
#           set audio-delay 0 ; show-text "Audio delay reset" #! Audio > Delay > Reset
#           cycle mute                                        #! Audio > Mute (toggle)

# ------------------------------------------------------------
#  SUBTITLES
# ------------------------------------------------------------
#           script-binding uosc/subtitles                     #! Subtitles > Subtitle Track...
#           script-binding uosc/load-subtitles                #! Subtitles > Load Subtitle File...
#           script-binding uosc/download-subtitles            #! Subtitles > Download Subtitles...
#           script-message panel-sub2                         #! Subtitles > Secondary Subtitle (top)...
#           cycle sub-visibility                              #! Subtitles > Visibility (toggle)
y           add sub-delay +0.042                              #! Subtitles > Timing > Delay +42 ms
x           add sub-delay -0.042                              #! Subtitles > Timing > Delay -42 ms
#           set sub-delay 0 ; show-text "Subtitle delay reset" #! Subtitles > Timing > Reset
g           cycle sub-fix-timing                              #! Subtitles > Timing > Auto Fix (toggle)
t           add sub-pos +1                                    #! Subtitles > Position/Size > Move Down
z           add sub-pos -1                                    #! Subtitles > Position/Size > Move Up
#           add sub-scale +0.05                               #! Subtitles > Position/Size > Larger
#           add sub-scale -0.05                               #! Subtitles > Position/Size > Smaller
#           set sub-scale 1 ; set sub-pos 100 ; show-text "Subtitle position/size reset" #! Subtitles > Position/Size > Reset
u           cycle-values sub-ass-override "force" "no"        #! Subtitles > Override ASS Style (toggle)
E           add sub-gauss +0.05                               #! Subtitles > Bitmap Blur +
R           add sub-gauss -0.05                               #! Subtitles > Bitmap Blur -
U           cycle sub-gray                                    #! Subtitles > Bitmap Grayscale
Z           sub-reload                                        #! Subtitles > Reload

